<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبه العائله </title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa&family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', 'Changa', cursive;
            background-color: #201547;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-top: 10px; /* Reduced top padding */
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            color: #ffffff;
            text-shadow: 6px 1.5px 0px #ff3796;
            font-size: 3rem;
            margin-bottom: 10px;
            margin-top: 10px;
            text-align: center;
        }

        button {
            font-family: 'Press Start 2P', 'Changa', cursive;
            background-color: #ff3796;
            color: #ffffff;
            border: 3px solid #ffffff;
            box-shadow: 5px 5px 0px #000000;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #f862a6;
            box-shadow: 2px 2px 0px #000000;
            transform: translate(3px, 3px);
        }
        
        button:active {
            box-shadow: 0px 0px 0px #000000;
            transform: translate(5px, 5px);
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 10px auto 20px;
            width: 100%;
            max-width: 1000px;
        }

        .category-buttons button {
            flex: 1 1 calc(33.333% - 20px);
            box-sizing: border-box;
            font-size: 1.6rem;
            padding: 25px;
            min-height: 200px;
        }

        .category-buttons button.completed {
            background-color: #4a3a7d;
            color: #8e81b3;
            border-color: #8e81b3;
            box-shadow: none;
            transform: none;
            cursor: pointer; /* Still clickable */
        }

        .category-buttons button.completed:hover {
             background-color: #5f4b9c;
        }

        .question-numbers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px auto;
            width: 90%;
            max-width: 500px;
        }

        .question-numbers button {
            flex: 1 1 calc(25% - 15px);
            box-sizing: border-box;
            aspect-ratio: 1 / 1;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        .question-numbers button.answered {
            background-color: #4a3a7d;
            color: #8e81b3;
            border-color: #8e81b3;
            box-shadow: none;
            transform: none;
            cursor: pointer; /* Still clickable */
        }
        
        .question-numbers button.answered:hover {
             background-color: #5f4b9c;
        }

        .question-display, .player-scores, #player-setup-view > div {
            background-color: #4a3a7d;
            border: 3px solid #ffffff;
            box-shadow: 5px 5px 0px #000000;
            padding: 20px;
            border-radius: 0; /* Remove border-radius for pixel look */
        }

        .question-display {
            margin: 10px 0 20px;
            min-height: 100px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.5;
            position: relative;
            padding: 20px;
        }
        
        .question-display img {
            max-width: 100%;
            max-height: 300px;
            height: auto;
            margin-top: 15px;
            border: 3px solid #ffffff;
            box-shadow: 5px 5px 0px #000000;
        }

        #question-number-display {
            position: relative;
            margin-bottom: 10px;
            text-align: center;
        }

        #question-number-display .number-circle {
            display: inline-block;
            background-color: #4a3a7d;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fca103;
            text-shadow: 2px 2px 0px #ff3796;
            box-shadow: 3px 3px 0px #000000;
            font-weight: bold;
        }

        .audio-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
        }

        .audio-container .audio-label {
            font-size: 1.8rem;
            color: #fca103;
            text-shadow: 3px 3px 0px #ff3796;
        }

        .audio-play-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #ff3796;
            border: 4px solid #ffffff;
            box-shadow: 6px 6px 0px #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease-in-out;
            padding: 0;
            min-height: unset;
        }

        .audio-play-btn:hover {
            background-color: #f862a6;
            box-shadow: 3px 3px 0px #000000;
            transform: translate(3px, 3px);
        }

        .audio-play-btn:active {
            box-shadow: 0px 0px 0px #000000;
            transform: translate(6px, 6px);
        }

        .audio-play-btn.playing {
            background-color: #fca103;
        }

        .audio-play-btn .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 20px 0 20px 35px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 8px;
        }

        .audio-play-btn.playing .play-icon {
            border-width: 0;
            width: 30px;
            height: 40px;
            border-left: 10px solid #ffffff;
            border-right: 10px solid #ffffff;
            margin-left: 0;
        }

        .audio-progress-wrapper {
            width: 80%;
            max-width: 300px;
            height: 20px;
            background-color: #201547;
            border: 3px solid #ffffff;
            box-shadow: inset 3px 3px 0px #000000;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .audio-progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff3796;
            transition: width 0.2s linear;
        }

        .audio-progress-wrapper.playing .audio-progress-bar {
            background-color: #fca103;
        }

        .audio-time {
            font-size: 0.6rem;
            color: #8e81b3;
            direction: ltr;
        }

        .audio-replay-hint {
            font-size: 0.7rem;
            color: #8e81b3;
        }

        .player-scores {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 180px;
            z-index: 1000;
            padding: 8px !important;
            transform: scale(0.9);
            transform-origin: top left;
        }
        
        .player-scores h2 {
            font-size: 1rem;
            margin: 0 0 5px 0;
            text-shadow: 2px 2px 0px #ff3796;
        }

        .player-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            font-size: 0.8rem;
            padding: 5px 0;
            font-size: 1rem;
        }

        .player-score button {
            padding: 5px 10px;
            font-size: 1rem;
            border-width: 2px;
            box-shadow: 3px 3px 0px #000;
        }
        
        .score-buttons {
            display: flex;
            gap: 5px;
        }

        .winner-button {
            width: 100%;
            margin-top: 15px;
            background-color: #fca103; /* Gold color for winner button */
            text-shadow: 3px 3px 0px #000;
        }

        .back-button-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px auto;
            text-align: left;
        }

        .back-button-container button {
            background-color: #4a3a7d;
            font-size: 1rem;
            padding: 10px 15px;
        }

        .random-button-container {
            margin-bottom: 25px;
            text-align: center;
        }

        #timer-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #4a3a7d;
            border: 3px solid #ffffff;
            box-shadow: 5px 5px 0px #000000;
            padding: 10px 20px;
            min-width: 100px;
            text-align: center;
            z-index: 1000;
            font-size: 3rem;
            color: #fca103;
            text-shadow: 4px 4px 0px #000;
        }

        #random-question-btn {
            background-color: #00c2cb; /* A nice cyan/teal color */
            font-size: 1.2rem;
            padding: 20px 30px;
        }

        #player-setup-view {
            text-align: center;
        }
        
        #player-setup-view > div {
             display: inline-block;
             padding: 30px;
        }

        input[type="text"] {
            font-family: 'Press Start 2P', 'Changa', cursive;
            width: calc(100% - 26px);
            padding: 10px;
            border: 3px solid #ffffff;
            background-color: #201547;
            color: #ffffff;
            box-shadow: inset 3px 3px 0px #000000;
            margin: 20px 0;
            font-size: 1rem;
        }

        .hidden {
            display: none !important;
        }

        #winner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(32, 21, 71, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .winner-box {
            background-color: #4a3a7d;
            border: 3px solid #ffffff;
            box-shadow: 8px 8px 0px #000000;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .winner-box h2 {
            font-size: 2.5rem;
            color: #fca103; /* Gold */
            text-shadow: 4px 4px 0px #ff3796;
            margin: 0 0 20px 0;
        }

        .winner-box p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>لعبة العائله</h1>

    <div id="player-setup-view">
        <div>
            <label for="player-names">Enter Player Names (2-6):</label>
            <input type="text" id="player-names" placeholder="Comma separated names">
            <button onclick="startGame()">Start Game</button>
        </div>
    </div>

    <div id="category-view" class="hidden">
        <div class="category-buttons">
            <button onclick="selectCategory('Islamic')">سؤال وجواب</button>
            <button onclick="selectCategory('Who’s in the Picture?')">من في الصوره؟</button>
            <button onclick="selectCategory('من القارئ')">من القارئ</button>
            <button onclick="selectCategory('Symbols')">شعار أو مكان</button>
            <button onclick="selectCategory('Smart Questions')">ماهو اسم التطبيق؟</button>
            <button onclick="selectCategory('Fill in the Blanks')">اكمل الفراغ</button>
        </div>
    </div>

    <div id="question-number-view" class="hidden">
        <div class="back-button-container">
            <button onclick="showCategoryView()">back</button>
        </div>
        <div class="random-button-container">
            <button id="random-question-btn" onclick="selectRandomQuestion()">Choose Randomly</button>
        </div>
        <div class="question-numbers"></div>
    </div>

    <div id="question-view" class="hidden">
        <div class="back-button-container">
            <button onclick="showQuestionNumberView()">back</button>
        </div>
        <div id="timer-display"></div>
        <div id="question-number-display"></div>
        <div class="question-display" id="question-display"></div>
    </div>

    <div class="player-scores" id="player-scores"></div>

    <div id="winner-overlay" class="hidden">
        <div class="winner-box">
            <h2 id="winner-title"></h2>
            <p id="winner-text"></p>
            <button onclick="hideWinner()">Close</button>
        </div>
    </div>

                '﴿اللَّهُ يَصطَفى مِنَ المَلٰئِكَةِ ___ وَمِنَ النّاسِ إِنَّ اللَّهَ سَميعٌ بَصيرٌ﴾ ',

                '﴿أَحَسِبَ النّاسُ أَن ___ أَن يَقولوا ءامَنّا وَهُم لا يُفتَنونَ﴾',
                '﴿وَإِذا تُتلىٰ عَلَيهِ ءايٰتُنا وَلّىٰ ___ كَأَن لَم يَسمَعها كَأَنَّ فى أُذُنَيهِ وَقرًا فَبَشِّرهُ بِعَذابٍ أَليمٍ﴾',
                '﴿فَلا تَعلَمُ نَفسٌ ____ لَهُم مِن قُرَّةِ أَعيُنٍ جَزاءً بِما كانوا يَعمَلونَ﴾',
                '﴿أَفَمَن زُيِّنَ لَهُ سوءُ عَمَلِهِ فَرَءاهُ حَسَنًا فَإِنَّ اللَّهَ يُضِلُّ مَن يَشاءُ وَيَهدى مَن يَشاءُ فَلا ___ نَفسُكَ عَلَيهِم حَسَرٰتٍ إِنَّ اللَّهَ عَليمٌ بِما يَصنَعونَ﴾',
                '﴿وَالَّذينَ اتَّخَذوا مِن دونِهِ أَولِياءَ اللَّهُ حَفيظٌ عَلَيهِم وَما أَنتَ عَلَيهِم ___',
                '﴿تِلكَ ءايٰتُ اللَّهِ نَتلوها عَلَيكَ بِالحَقِّ فَبِأَىِّ ___ بَعدَ اللَّهِ وَءايٰتِهِ يُؤمِنونَ﴾',
                '﴿وَأَرسَلنَا الرِّيٰحَ لَوٰقِحَ فَأَنزَلنا مِنَ السَّماءِ ماءً ___ وَما أَنتُم لَهُ بِخٰزِنينَ﴾ '
            ]
        };

        const answeredQuestions = {
            'Islamic': new Set(),
            'Who’s in the Picture?': new Set(),
            'من القارئ': new Set(),
            'Symbols': new Set(),
            'Smart Questions': new Set(),
            'Fill in the Blanks': new Set()
        };

        function showView(viewId) {
            document.getElementById('player-setup-view').classList.add('hidden');
            document.getElementById('category-view').classList.add('hidden');
            document.getElementById('question-number-view').classList.add('hidden');
            document.getElementById('question-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function startGame() {
            const namesInput = document.getElementById('player-names');
            const names = namesInput.value.split(',').map(name => name.trim()).filter(name => name);
            if (names.length < 2 || names.length > 6) {
                alert('Please enter between 2 and 6 player names.');
                return;
            }
            players = names;
            players.forEach(player => {
                scores[player] = 0;
            });
            updateScores();
            showCategoryView();
        }

        function updateScores() {
            const scoresDiv = document.getElementById('player-scores');
            scoresDiv.innerHTML = '';
            players.forEach(player => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-score';

                const nameSpan = document.createElement('span');
                nameSpan.textContent = `${player}: ${scores[player]}`;

                const buttonWrapper = document.createElement('div');
                buttonWrapper.className = 'score-buttons';

                const decrementButton = document.createElement('button');
                decrementButton.textContent = '-1';
                decrementButton.onclick = () => decrementScore(player);

                const incrementButton = document.createElement('button');
                incrementButton.textContent = '+1';
                incrementButton.onclick = () => incrementScore(player);
                
                buttonWrapper.appendChild(decrementButton);
                buttonWrapper.appendChild(incrementButton);

                playerDiv.appendChild(nameSpan);
                playerDiv.appendChild(buttonWrapper);
                scoresDiv.appendChild(playerDiv);
            });

            const winnerButton = document.createElement('button');
            winnerButton.textContent = 'Show Winner';
            winnerButton.className = 'winner-button';
            winnerButton.onclick = showWinner;
            scoresDiv.appendChild(winnerButton);
        }

        function incrementScore(player) {
            scores[player]++;
            updateScores();
        }

        function decrementScore(player) {
            if (scores[player] > 0) {
                scores[player]--;
                updateScores();
            }
        }

        function showWinner() {
            let maxScore = -1;
            for (const player in scores) {
                if (scores[player] > maxScore) {
                    maxScore = scores[player];
                }
            }

            if (maxScore <= 0) {
                alert("No one has scored yet!");
                return;
            }

            const winners = players.filter(p => scores[p] === maxScore);
            const winnerOverlay = document.getElementById('winner-overlay');
            const winnerTitle = document.getElementById('winner-title');
            const winnerText = document.getElementById('winner-text');

            let title = '';
            let text = '';

            if (winners.length === 1) {
                title = 'مبروك';
                text = `${winners[0]} ب ${maxScore} نقاط `;
            } else {
                title = "تعادل ";
                text = `${winners.join(' و ')} ب ${maxScore} نقاط`;
            }

            winnerTitle.textContent = title;
            winnerText.textContent = text;
            winnerOverlay.classList.remove('hidden');

            // Fire confetti
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });
        }

        function hideWinner() {
            document.getElementById('winner-overlay').classList.add('hidden');
        }

        function selectRandomQuestion() {
            const allQuestions = Array.from({ length: 10 }, (_, i) => i + 1);
            const answered = answeredQuestions[currentCategory];
            const availableQuestions = allQuestions.filter(q => !answered.has(q));

            if (availableQuestions.length === 0) {
                alert("All questions in this category have been answered!");
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            const randomQuestionNumber = availableQuestions[randomIndex];

            showQuestion(randomQuestionNumber);
        }

        function selectCategory(category) {
            currentCategory = category;
            const questionNumbersDiv = document.querySelector('.question-numbers');
            questionNumbersDiv.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const questionButton = document.createElement('button');
                questionButton.textContent = i;
                questionButton.onclick = () => showQuestion(i);
                if (answeredQuestions[category].has(i)) {
                    questionButton.classList.add('answered');
                }
                questionNumbersDiv.appendChild(questionButton);
            }
            showView('question-number-view');
        }

        function showQuestion(number) {
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            const questionDisplay = document.querySelector('#question-view .question-display');
            const timerDisplay = document.getElementById('timer-display');
            
            const questionData = gameData[currentCategory][number - 1];
            const totalQuestions = gameData[currentCategory].length;
            
            // Stop any previously playing audio
            stopCurrentAudio();

            // Build question content
            let questionContent = '';
            if (currentCategory === 'من القارئ') {
                questionContent = `
                    <div class="audio-container">
                        <div class="audio-label">من القارئ؟</div>
                        <button class="audio-play-btn" onclick="toggleAudio(this, '${questionData}')">
                            <div class="play-icon"></div>
                        </button>
                        <div class="audio-progress-wrapper" id="audio-progress-wrapper" onclick="seekAudio(event)" onmousedown="startDrag(event)" onmousemove="dragSeek(event)" onmouseup="endDrag()" onmouseleave="endDrag()" ontouchstart="startDrag(event)" ontouchmove="dragSeek(event)" ontouchend="endDrag()">
                            <div class="audio-progress-bar" id="audio-progress-bar"></div>
                        </div>
                        <div class="audio-time" id="audio-time">0:00 / 0:00</div>
                        <div class="audio-replay-hint">اضغط للتشغيل</div>
                    </div>
                `;
            } else {
                questionContent = questionData;
            }

            // Add question number display with background
            const questionNumberDisplay = document.getElementById('question-number-display');
            questionNumberDisplay.innerHTML = `
                <div class="number-circle">${number}</div>
            `;

            // Set question content
            questionDisplay.innerHTML = questionContent;

            answeredQuestions[currentCategory].add(number);
            showView('question-view');
            // Update the button state in the question number view
            const questionButton = document.querySelector(`#question-number-view .question-numbers button:nth-child(${number})`);
            questionButton.classList.add('answered');

            // Start Timer
            let timeLeft = 60;
            timerDisplay.textContent = timeLeft;
            timerDisplay.style.color = '#fca103'; // Reset color

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft >= 0) {
                    timerDisplay.textContent = timeLeft;
                }
                if (timeLeft < 10 && timeLeft >= 0) {
                    timerDisplay.style.color = '#ff3796'; // Change to pink for urgency
                }
                if (timeLeft < 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = "Time's Up!";
                }
            }, 1000);
        }

        function updateCategoryButtons() {
            const categoryButtons = document.querySelectorAll('.category-buttons button');
            const categories = Object.keys(gameData);

            categoryButtons.forEach((button, index) => {
                if (index < categories.length) {
                    const category = categories[index];
                    const totalQuestions = gameData[category].length;
                    const answeredCount = answeredQuestions[category] ? answeredQuestions[category].size : 0;
                    if (answeredCount >= totalQuestions) {
                        button.classList.add('completed');
                    } else {
                        button.classList.remove('completed');
                    }
                }
            });
        }

        function showCategoryView() {
            stopCurrentAudio();
            updateCategoryButtons();
            showView('category-view');
        }

        function stopCurrentAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            const activeBtn = document.querySelector('.audio-play-btn.playing');
            if (activeBtn) {
                activeBtn.classList.remove('playing');
            }
            const bar = document.getElementById('audio-progress-bar');
            if (bar) bar.style.width = '0%';
            const wrapper = document.getElementById('audio-progress-wrapper');
            if (wrapper) wrapper.classList.remove('playing');
            const timeDisplay = document.getElementById('audio-time');
            if (timeDisplay) timeDisplay.textContent = '0:00 / 0:00';
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function updateProgressBar() {
            const bar = document.getElementById('audio-progress-bar');
            const timeDisplay = document.getElementById('audio-time');
            const wrapper = document.getElementById('audio-progress-wrapper');
            if (!bar || !currentAudio) return;

            const progress = currentAudio.duration ? (currentAudio.currentTime / currentAudio.duration) * 100 : 0;
            bar.style.width = progress + '%';
            timeDisplay.textContent = formatTime(currentAudio.currentTime) + ' / ' + formatTime(currentAudio.duration || 0);

            if (!currentAudio.paused) {
                wrapper.classList.add('playing');
            } else {
                wrapper.classList.remove('playing');
            }
        }

        let isDragging = false;

        function getSeekPosition(e) {
            const wrapper = document.getElementById('audio-progress-wrapper');
            if (!wrapper) return 0;
            const rect = wrapper.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let ratio = (clientX - rect.left) / rect.width;
            return Math.max(0, Math.min(1, ratio));
        }

        function seekAudio(e) {
            if (!currentAudio || !currentAudio.duration) return;
            currentAudio.currentTime = getSeekPosition(e) * currentAudio.duration;
            updateProgressBar();
        }

        function startDrag(e) {
            if (!currentAudio || !currentAudio.duration) return;
            isDragging = true;
            seekAudio(e);
            e.preventDefault();
        }

        function dragSeek(e) {
            if (!isDragging || !currentAudio || !currentAudio.duration) return;
            seekAudio(e);
            e.preventDefault();
        }

        function endDrag() {
            isDragging = false;
        }

        function toggleAudio(button, src) {
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                button.classList.remove('playing');
                updateProgressBar();
            } else {
                if (!currentAudio || currentAudio.src !== new URL(src, window.location.href).href) {
                    if (currentAudio) {
                        currentAudio.pause();
                    }
                    currentAudio = new Audio(src);
                    currentAudio.addEventListener('timeupdate', updateProgressBar);
                    currentAudio.addEventListener('ended', () => {
                        button.classList.remove('playing');
                        updateProgressBar();
                    });
                    currentAudio.addEventListener('loadedmetadata', updateProgressBar);
                }
                currentAudio.play();
                button.classList.add('playing');
            }
        }

        function showQuestionNumberView() {
            stopCurrentAudio();
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            showView('question-number-view');
        }
    </script>
</body>
</html>
